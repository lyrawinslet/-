name: 提交结果核对

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 核对五份结果（仅标准库）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 从原始附件重算电量、储能状态与费用
        run: python run.py --task verify
